[theme]
primaryColor            = "#1B5C74"
backgroundColor         = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor               = "#1a2a3a"
font                    = "sans serif"

[client]
# Меню в правом верхнем углу: только пользовательские пункты,
# без "Clear cache", "Rerun", "Deploy" и прочего для разработчика.
toolbarMode = "minimal"
# Пользователь видит короткое сообщение об ошибке вместо трейсбека
# на английском. Полный трейсбек остаётся в логах контейнера.
showErrorDetails = false

[browser]
# Отключает отправку телеметрии Streamlit на внешние серверы.
# Важно для госзаказчиков и реестра отечественного ПО.
gatherUsageStats = false

[server]
# =============================================================================
# WebSocket ping/timeout — увеличено, чтобы сессия переживала долгие
# генерации LLM без разрыва
# =============================================================================
# ПРИЧИНА. По умолчанию Streamlit (на Tornado >= 6.5) шлёт ping каждые 30
# секунд и считает соединение мёртвым, если pong не пришёл за те же 30
# секунд. Пока Python-скрипт занят синхронной блокирующей операцией
# (retrieval + LLM-стриминг, у нас — до нескольких десятков секунд, а
# timeout_seconds в конфиге модели допускает генерацию до 300 сек), event
# loop может не успевать вовремя обработать ping/pong, и Tornado считает
# соединение оборванным. Известный баг Streamlit: сессия после такого
# "unclean close" не восстанавливается корректно, а виснет намертво —
# требуется закрыть вкладку браузера, простой рефреш/reconnect не помогает
# (github.com/streamlit/streamlit issues #6442, #8901, #12108).
#
# ФИКС. websocketPingInterval одновременно задаёт и interval, и timeout
# (Streamlit синхронизирует эти два значения). Подняли до 240 секунд —
# запас над типичной длительностью генерации (30-60 сек), но меньше
# полного timeout_seconds=300 у модели, чтобы явный обрыв Ollama-запроса
# происходил раньше, чем WS посчитает сессию мёртвой.
#
# Если генерация станет ещё длиннее (bigger max_tokens, более медленная
# модель) — увеличивайте это значение синхронно с timeout_seconds в
# core/advisor.py (config.get("timeout_seconds", 300)).
websocketPingInterval = 240

# Увеличенный лимит на размер сообщения по WS — большие ответы модели
# (таблицы, длинные списки источников) не должны упираться в дефолтный
# лимит 200MB, но держим с запасом на случай экспорта истории.
maxMessageSize = 400

[logger]
level = "debug"